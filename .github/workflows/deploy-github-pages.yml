name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCQ_FIREBASE_API_KEY: ${{ secrets.GCQ_FIREBASE_API_KEY }}
      GCQ_FIREBASE_AUTH_DOMAIN: ${{ secrets.GCQ_FIREBASE_AUTH_DOMAIN }}
      GCQ_FIREBASE_PROJECT_ID: ${{ secrets.GCQ_FIREBASE_PROJECT_ID }}
      GCQ_FIREBASE_STORAGE_BUCKET: ${{ secrets.GCQ_FIREBASE_STORAGE_BUCKET }}
      GCQ_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GCQ_FIREBASE_MESSAGING_SENDER_ID }}
      GCQ_FIREBASE_APP_ID: ${{ secrets.GCQ_FIREBASE_APP_ID }}
      GCQ_FIREBASE_MEASUREMENT_ID: ${{ secrets.GCQ_FIREBASE_MEASUREMENT_ID }}
      GCQ_BILLING_BASE_URL: ${{ secrets.GCQ_BILLING_BASE_URL }}
      GCQ_BILLING_SCHOOL_ID: ${{ secrets.GCQ_BILLING_SCHOOL_ID }}
      GCQ_APP_CHECK_SITE_KEY: ${{ secrets.GCQ_APP_CHECK_SITE_KEY }}
      GCQ_REQUIRE_CONFIG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Verify behavior and production dependencies
        run: |
          npm test
          npm run test:rules
          npm run audit:prod

      - name: Build static site
        run: npm run build:static

      - name: Verify dist output
        run: |
          test -d dist
          test -f dist/index.html
          echo "dist directory ready for upload"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # deploy-pages v5 currently reaches Node's legacy punycode shim internally.
      # Suppress only that upstream runtime deprecation; all other warnings remain visible.
      NODE_OPTIONS: --disable-warning=DEP0040
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages can remain queued for several minutes before publishing
          # starts. Keep the official action alive long enough for that backend
          # queue plus the actual deployment to finish.
          timeout: 1800000
