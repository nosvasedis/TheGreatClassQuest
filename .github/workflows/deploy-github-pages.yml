name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Once a night, after lessons: 22:00 UTC is 00:00 Athens in winter (EET) and 01:00 in
    # summer (EEST). GitHub often starts scheduled runs hours late, so the gate below accepts
    # the whole night (an exact-midnight check used to skip every night).
    - cron: '0 22 * * *'

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Decide whether to deploy
        id: check
        run: |
          athens_now="$(TZ=Europe/Athens date -Iseconds)"
          athens_hour="$((10#$(TZ=Europe/Athens date +%H)))"
          echo "Event: ${{ github.event_name }}; Athens time: ${athens_now}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The nightly run deploys whenever it starts between 22:00 and 07:59 Athens time;
          # only a run delayed into the school day is skipped (tomorrow night catches up).
          if [ "$athens_hour" -ge 22 ] || [ "$athens_hour" -lt 8 ]; then
            echo "Night in Athens — deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Daytime in Athens — skipping so open classroom tabs are not updated mid-lesson."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build path-portable production site
        env:
          GCQ_BILLING_SCHOOL_ID: ${{ secrets.GCQ_BILLING_SCHOOL_ID }}
          GCQ_FIREBASE_API_KEY: ${{ secrets.GCQ_FIREBASE_API_KEY }}
          GCQ_FIREBASE_APP_ID: ${{ secrets.GCQ_FIREBASE_APP_ID }}
          GCQ_FIREBASE_AUTH_DOMAIN: ${{ secrets.GCQ_FIREBASE_AUTH_DOMAIN }}
          GCQ_FIREBASE_MEASUREMENT_ID: ${{ secrets.GCQ_FIREBASE_MEASUREMENT_ID }}
          GCQ_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GCQ_FIREBASE_MESSAGING_SENDER_ID }}
          GCQ_FIREBASE_PROJECT_ID: ${{ secrets.GCQ_FIREBASE_PROJECT_ID }}
          GCQ_FIREBASE_STORAGE_BUCKET: ${{ secrets.GCQ_FIREBASE_STORAGE_BUCKET }}
        run: npm run build:static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
