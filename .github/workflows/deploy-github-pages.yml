name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC-only. Fire at both candidate UTC hours for
    # Europe/Athens midnight (EEST=UTC+3 → 21:00, EET=UTC+2 → 22:00),
    # then gate the real deploy on the Athens clock below.
    - cron: '0 21,22 * * *'

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Decide whether to deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          athens_hour="$(TZ=Europe/Athens date +%H)"
          athens_now="$(TZ=Europe/Athens date -Iseconds)"
          echo "Athens time: ${athens_now} (hour=${athens_hour})"

          if [ "$athens_hour" = "00" ]; then
            echo "Midnight Athens — deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not midnight Athens — skipping this UTC cron slot."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build path-portable production site
        env:
          GCQ_BILLING_SCHOOL_ID: ${{ secrets.GCQ_BILLING_SCHOOL_ID }}
          GCQ_FIREBASE_API_KEY: ${{ secrets.GCQ_FIREBASE_API_KEY }}
          GCQ_FIREBASE_APP_ID: ${{ secrets.GCQ_FIREBASE_APP_ID }}
          GCQ_FIREBASE_AUTH_DOMAIN: ${{ secrets.GCQ_FIREBASE_AUTH_DOMAIN }}
          GCQ_FIREBASE_MEASUREMENT_ID: ${{ secrets.GCQ_FIREBASE_MEASUREMENT_ID }}
          GCQ_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GCQ_FIREBASE_MESSAGING_SENDER_ID }}
          GCQ_FIREBASE_PROJECT_ID: ${{ secrets.GCQ_FIREBASE_PROJECT_ID }}
          GCQ_FIREBASE_STORAGE_BUCKET: ${{ secrets.GCQ_FIREBASE_STORAGE_BUCKET }}
        run: npm run build:static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
