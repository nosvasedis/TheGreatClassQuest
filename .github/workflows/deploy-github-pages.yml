name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCQ_FIREBASE_API_KEY: ${{ secrets.GCQ_FIREBASE_API_KEY }}
      GCQ_FIREBASE_AUTH_DOMAIN: ${{ secrets.GCQ_FIREBASE_AUTH_DOMAIN }}
      GCQ_FIREBASE_PROJECT_ID: ${{ secrets.GCQ_FIREBASE_PROJECT_ID }}
      GCQ_FIREBASE_STORAGE_BUCKET: ${{ secrets.GCQ_FIREBASE_STORAGE_BUCKET }}
      GCQ_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GCQ_FIREBASE_MESSAGING_SENDER_ID }}
      GCQ_FIREBASE_APP_ID: ${{ secrets.GCQ_FIREBASE_APP_ID }}
      GCQ_FIREBASE_MEASUREMENT_ID: ${{ secrets.GCQ_FIREBASE_MEASUREMENT_ID }}
      GCQ_BILLING_BASE_URL: ${{ secrets.GCQ_BILLING_BASE_URL }}
      GCQ_BILLING_SCHOOL_ID: ${{ secrets.GCQ_BILLING_SCHOOL_ID }}
      GCQ_APP_CHECK_SITE_KEY: ${{ secrets.GCQ_APP_CHECK_SITE_KEY }}
      GCQ_REQUIRE_CONFIG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Verify behavior and production dependencies
        run: |
          npm test
          npm run test:rules
          npm run audit:prod

      - name: Build static site
        run: npm run build:static

      - name: Verify dist output
        run: |
          test -d dist
          test -f dist/index.html
          echo "dist directory ready for upload"

      - name: Publish static site branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          deploy_dir="${RUNNER_TEMP}/great-class-quest-pages"
          mkdir -p "$deploy_dir"
          cp -R dist/. "$deploy_dir/"
          touch "$deploy_dir/.nojekyll"
          git -C "$deploy_dir" init
          git -C "$deploy_dir" checkout -b gh-pages
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" add --all
          git -C "$deploy_dir" commit -m "Deploy ${GITHUB_SHA}"
          git -C "$deploy_dir" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$deploy_dir" push --force origin gh-pages
