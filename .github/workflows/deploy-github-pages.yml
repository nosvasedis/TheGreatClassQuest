name: Deploy GitHub Pages (manual fallback)

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build path-portable production site
        env:
          GCQ_BILLING_SCHOOL_ID: ${{ secrets.GCQ_BILLING_SCHOOL_ID }}
          GCQ_FIREBASE_API_KEY: ${{ secrets.GCQ_FIREBASE_API_KEY }}
          GCQ_FIREBASE_APP_ID: ${{ secrets.GCQ_FIREBASE_APP_ID }}
          GCQ_FIREBASE_AUTH_DOMAIN: ${{ secrets.GCQ_FIREBASE_AUTH_DOMAIN }}
          GCQ_FIREBASE_MEASUREMENT_ID: ${{ secrets.GCQ_FIREBASE_MEASUREMENT_ID }}
          GCQ_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GCQ_FIREBASE_MESSAGING_SENDER_ID }}
          GCQ_FIREBASE_PROJECT_ID: ${{ secrets.GCQ_FIREBASE_PROJECT_ID }}
          GCQ_FIREBASE_STORAGE_BUCKET: ${{ secrets.GCQ_FIREBASE_STORAGE_BUCKET }}
        run: npm run build:static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
