name: Deploy Guidebook to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - '**/*.html'
      - 'docs/product/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-guidebook-pages.yml'

concurrency:
  group: guidebook-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build and stage guidebook
        env:
          GCQ_BILLING_SCHOOL_ID: ${{ secrets.GCQ_BILLING_SCHOOL_ID }}
          GCQ_FIREBASE_API_KEY: ${{ secrets.GCQ_FIREBASE_API_KEY }}
          GCQ_FIREBASE_APP_ID: ${{ secrets.GCQ_FIREBASE_APP_ID }}
          GCQ_FIREBASE_AUTH_DOMAIN: ${{ secrets.GCQ_FIREBASE_AUTH_DOMAIN }}
          GCQ_FIREBASE_MEASUREMENT_ID: ${{ secrets.GCQ_FIREBASE_MEASUREMENT_ID }}
          GCQ_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GCQ_FIREBASE_MESSAGING_SENDER_ID }}
          GCQ_FIREBASE_PROJECT_ID: ${{ secrets.GCQ_FIREBASE_PROJECT_ID }}
          GCQ_FIREBASE_STORAGE_BUCKET: ${{ secrets.GCQ_FIREBASE_STORAGE_BUCKET }}
        run: npm run guidebook:site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .guidebook-dist --project-name=gcq-guidebook --branch=main
