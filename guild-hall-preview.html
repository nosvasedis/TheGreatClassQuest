<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guild Hall live preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&family=Open+Sans:wght@400;600;700&family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #f5efe0; }
    #pv-app { padding: 16px 0 120px; }
    .pv-toolbar { position: fixed; left: 10px; bottom: 10px; z-index: 999; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70vw; padding: 8px; border-radius: 14px; background: rgba(15, 23, 42, 0.86); font: 600 12px system-ui; }
    .pv-toolbar button { color: #fff; border: 0; cursor: pointer; padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,.14); font: inherit; }
    .pv-toolbar button:hover { background: rgba(255,255,255,.26); }
    body.pv-shot .pv-toolbar { display: none; }
  </style>
</head>
<body>
  <div id="pv-app"></div>
  <div class="pv-toolbar" id="pv-toolbar"></div>
  <script type="module" src="/guild-hall-preview.js"></script>
</body>
</html>
