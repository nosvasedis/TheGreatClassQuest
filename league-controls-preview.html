<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>League controls preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&family=Open+Sans:wght@400;600;700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: linear-gradient(to bottom, #F0F9FF 0%, #E0F2FE 50%, #D6F9E3 100%); font-family: 'Open Sans', sans-serif; }
    main { padding: 1.5rem 1rem 3rem; }
    .pv-fake-list { max-width: 60rem; margin: 0 auto; height: 14rem; border-radius: 1.5rem; background: rgba(255,255,255,.45); border: 2px dashed rgba(100,116,139,.25); display: grid; place-items: center; color: #64748b; font: 600 14px Fredoka, sans-serif; }
    .pv-toolbar { position: fixed; left: 10px; bottom: 10px; z-index: 9999; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-radius: 14px; background: rgba(15, 23, 42, 0.82); font: 600 12px system-ui; }
    .pv-toolbar a { color: #fff; text-decoration: none; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.12); }
    body.pv-shot .pv-toolbar { display: none; }
  </style>
</head>
<body>
  <main id="pv-main"></main>
  <div id="pv-modals"></div>
  <div class="pv-toolbar" id="pv-toolbar"></div>
  <script type="module" src="/league-controls-preview.js"></script>
</body>
</html>
