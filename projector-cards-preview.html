<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projector cards preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&family=Lora:ital@0;1&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    html, body { margin: 0; min-height: 100%; background: linear-gradient(180deg, #7cc4f5, #cde9fb); overflow: auto !important; }
    #pv-grid { display: flex; flex-wrap: wrap; gap: 28px; padding: 28px; align-items: flex-start; }
    #pv-grid .sky-card { position: relative !important; left: auto !important; top: auto !important; opacity: 1 !important; transform: none !important; }
    .pv-label { font: 700 12px system-ui; color: #0f172a; margin: 0 0 6px; }
    .pv-missing { font: 600 13px system-ui; color: #7f1d1d; padding: 0 28px 28px; }
  </style>
  <script>
    // ?date=YYYY-MM-DD fixes "today" for the calendar cards (default: the real today).
    (function () {
      var q = new URLSearchParams(location.search).get('date');
      if (!q) return;
      var Real = Date, base = new Real(q + 'T10:30:00').getTime(), start = Real.now();
      function Fake() { var a = Array.prototype.slice.call(arguments); return a.length ? new (Function.prototype.bind.apply(Real, [null].concat(a)))() : new Real(base + (Real.now() - start)); }
      Fake.prototype = Real.prototype; Fake.now = function () { return base + (Real.now() - start); }; Fake.UTC = Real.UTC; Fake.parse = Real.parse;
      window.Date = Fake;
    })();
  </script>
</head>
<body>
  <div id="pv-grid"></div>
  <div class="pv-missing" id="pv-missing"></div>
  <script type="module" src="/projector-cards-preview.js"></script>
</body>
</html>
