<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>School calendar preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: linear-gradient(180deg, #e0e7ff 0%, #f5f3ff 40%, #faf5ff 100%); font-family: 'Fredoka', sans-serif; padding: 1.5rem; }
    .pv-scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 1.25rem; max-width: 1400px; margin: 0 auto; }
    .pv-scenes .schedule-list-v2 { padding: 0; min-height: 0; }
    .pv-office { max-width: 980px; margin: 0 auto; }
    #calendar-tab { display: block !important; }
  </style>
</head>
<body>
  <div id="pv-root"></div>
  <script type="module" src="/school-calendar-preview.js"></script>
</body>
</html>
