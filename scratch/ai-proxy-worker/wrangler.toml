name = "great-class-quest-ai-proxy"
main = "src/worker.js"
compatibility_date = "2026-08-06"
workers_dev = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "QUOTE_CACHE"
id = "f75e296a94754121b221eafac8e72ec2"

# Monthly AI allowance per school (never the founding school). SQLite-backed Durable Objects are
# available on Workers Free. Limits per plan: DEFAULT_SCHOOL_AI_LIMITS in src/worker.js, or the
# optional SCHOOL_AI_MONTHLY_LIMITS JSON var, e.g. {"pro":{"chat":2000}}.
[[durable_objects.bindings]]
name = "SCHOOL_AI_USAGE"
class_name = "SchoolAiUsage"

[[migrations]]
tag = "v1-school-ai-usage"
new_sqlite_classes = ["SchoolAiUsage"]

[vars]
FIREBASE_PROJECT_ID = "the-great-class-quest"
FIREBASE_PROJECT_NUMBER = "1021026433595"
FIREBASE_APP_ID = "1:1021026433595:web:d1bc4b6f45f01fe25c3a1e"
REQUIRE_APP_CHECK = "false"
# Workers Free was verified in the account dashboard on 2026-10-04.
# Recheck before deploying; disable if upgrading to Paid, which bills overages.
# Free accounts stop inference at the shared 10,000 neurons/day.
SPEECH_FREE_PLAN_CONFIRMED = "true"
ALLOWED_ORIGINS = "https://nosvasedis.github.io,https://great-class-quest-school.pages.dev,https://the-great-class-quest.web.app,https://the-great-class-quest.firebaseapp.com,http://127.0.0.1:3000,http://localhost:3000"
# Keep old browser model hints accepted during rollout; the Worker sends deepseek-flash upstream.
ALLOWED_CLIENT_TEXT_MODELS = "deepseek-flash,deepseek/deepseek-v4-flash,google/gemini-3.1-flash-lite-preview"
