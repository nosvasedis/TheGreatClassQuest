<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Theater preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { margin: 0; font-family: Fredoka, ui-rounded, sans-serif; background: #e0f2fe; }
    .preview-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; background: #111827; }
    .preview-toolbar button { border: 0; border-radius: 999px; padding: 6px 11px; font-weight: 600; font-size: 13px; cursor: pointer; background: #e0e7ff; color: #1e1b4b; }
    .preview-toolbar button[data-night] { background: #312e81; color: #fff; }
    .preview-toolbar .sep { width: 100%; height: 0; }
    #app-screen { display: flex !important; }
  </style>
</head>
<body>
  <div id="preview-app"></div>
  <div class="preview-toolbar" id="toolbar">
    <button data-night="1">Toggle night</button>
    <button data-dir="1">Force →</button>
    <button data-dir="-1">Force ←</button>
    <button data-dir="0">Random dir</button>
    <span class="sep"></span>
  </div>
  <script type="module">
    import { headerHTML, svgFiltersHTML } from '/templates/app/header.js';
    import { debugPlayAct, listSkyTheaterActs } from '/features/skyTheater.js';

    document.getElementById('preview-app').innerHTML = `${svgFiltersHTML}
      <div id="app-screen" class="flex flex-col">
        <div id="award-header-atmosphere" class="award-header-atmosphere relative z-[60] flex shrink-0 flex-col overflow-visible shadow-md"
             style="background: linear-gradient(to right, #89f7fe 0%, #66a6ff 100%);">${headerHTML}</div>
      </div>`;
    document.getElementById('current-date').textContent = 'Tuesday, 29 September';
    document.getElementById('current-time').textContent = '10:42';

    let dir;
    const bar = document.getElementById('toolbar');
    for (const id of listSkyTheaterActs()) {
      const b = document.createElement('button');
      b.textContent = id;
      b.addEventListener('click', () => debugPlayAct(id, dir));
      bar.appendChild(b);
    }
    bar.addEventListener('click', (e) => {
      const t = e.target;
      if (t.dataset.night) {
        const header = document.querySelector('header');
        header.classList.toggle('header-night');
        document.getElementById('award-header-atmosphere').style.background = header.classList.contains('header-night')
          ? 'linear-gradient(to right, #1e1b4b 0%, #312e81 100%)'
          : 'linear-gradient(to right, #89f7fe 0%, #66a6ff 100%)';
      }
      if (t.dataset.dir !== undefined) dir = Number(t.dataset.dir) || undefined;
    });
    window.__play = (id, d) => debugPlayAct(id, d);
  </script>
</body>
</html>
