<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starfall preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&family=Open+Sans:wght@400;600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: linear-gradient(180deg, #e0e7ff 0%, #f5f3ff 40%, #faf5ff 100%); font-family: 'Fredoka', sans-serif; }
    .pv-fake { padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: 1rem; }
    .pv-fake div { height: 7rem; border-radius: 1rem; background: #fff; box-shadow: 0 4px 14px rgba(80,60,160,.12); }
  </style>
</head>
<body>
  <div class="pv-fake"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <div id="pv-root"></div>
  <script type="module" src="/starfall-preview.js"></script>
</body>
</html>
