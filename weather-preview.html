<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky weather preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&family=Open+Sans:wght@400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: linear-gradient(to bottom, #F0F9FF 0%, #E0F2FE 50%, #D6F9E3 100%); }
    #app-screen { display: flex !important; height: 100vh; }
    #preview-main { flex: 1; overflow: auto; padding: 1.25rem; }
    .pv-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1rem; max-width: 80rem; margin: 0 auto; }
    .pv-toolbar { position: fixed; right: 10px; bottom: 10px; z-index: 999; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; padding: 8px; border-radius: 14px; background: rgba(15, 23, 42, 0.82); font: 600 12px system-ui; }
    .pv-toolbar button, .pv-toolbar select { border: 0; border-radius: 999px; padding: 5px 10px; font: inherit; cursor: pointer; }
    body.pv-shot .pv-toolbar { display: none; }
    @media (max-width: 700px) { .pv-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <div class="pv-toolbar">
    <select id="pv-code">
      <option value="0">Sunny</option><option value="2">Partly cloudy</option><option value="3">Overcast</option>
      <option value="45">Fog</option><option value="53">Drizzle</option><option value="61">Light rain</option>
      <option value="63">Rain</option><option value="65">Heavy rain</option><option value="81">Showers</option>
      <option value="66">Icy</option><option value="71">Light snow</option><option value="73">Snow</option>
      <option value="75">Heavy snow</option><option value="95">Storm</option><option value="96">Hail</option>
    </select>
    <select id="pv-time">
      <option value="09:40">Morning</option><option value="14:00">Afternoon</option>
      <option value="19:50">Sunset</option><option value="23:00">Night</option><option value="06:40">Dawn</option>
    </select>
    <button id="pv-sky">Toggle Award sky</button>
  </div>
  <script type="module" src="/weather-preview.js"></script>
</body>
</html>
